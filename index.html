<!DOCTYPE html>

<html lang="fr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>GB Browser 2.0</title> <link rel="stylesheet" href="style.css"> </head>

<body>

<header> <h1>💜 GB BROWSER</h1> <p>Gaming Internet 2.0</p> </header>

<main>

<h2>🔎 Recherche Internet</h2>

<form id="search"> <input id="address" placeholder="Google ou adresse Internet..." required> <button type="submit">Rechercher</button> </form>

<h2>🌐 Applications</h2>

<div class="buttons"> <button data-url="https://www.google.com">🔎 Google</button> <button data-url="https://www.youtube.com">▶ YouTube</button> <button data-url="https://www.wikipedia.org">🌍 Wikipédia</button> <button data-url="https://play.geforcenow.com">🎮 GeForce NOW</button> </div>

<h2>⭐ Favoris</h2> <div id="favorites"> <button data-url="https://www.google.com">Google</button> <button data-url="https://www.youtube.com">YouTube</button> </div>

<h2>🕘 Historique</h2> <ul id="history"></ul>

<h2>🎮 Navigation</h2> <button id="back">◀ Retour</button> <button id="home">🏠 Accueil</button>

</main>

<footer>GB Browser 2.0 — Purple Gaming Edition</footer>

<script src="controls.js"></script>

<script> const favorites = [ { name: "Google", url: "https://www.google.com" }, { name: "YouTube", url: "https://www.youtube.com" } ]; const historyList = []; function openSite(url) { historyList.unshift(url); historyList.splice(10); renderHistory(); window.open(url, "_blank"); } function renderHistory() { const list = document.getElementById("history"); list.innerHTML = ""; historyList.forEach(url => { const li = document.createElement("li"); const button = document.createElement("button"); button.textContent = url; button.addEventListener("click", () => openSite(url)); li.appendChild(button); list.appendChild(li); }); } document.querySelectorAll("[data-url]").forEach(button => { button.addEventListener("click", () => openSite(button.dataset.url)); }); document.getElementById("search").addEventListener("submit", event => { event.preventDefault(); const value = document.getElementById("address").value.trim(); if (!value) return; let url; if (/^https?:\/\//i.test(value)) { url = value; } else if (/^[\w-]+\.[a-z]{2,}/i.test(value)) { url = "https://" + value; } else { url = "https://www.google.com/search?q=" + encodeURIComponent(value); } openSite(url); }); document.getElementById("back").addEventListener("click", () => { history.back(); }); document.getElementById("home").addEventListener("click", () => { window.location.href = "index.html"; }); </script>

</body> </html>
