<!DOCTYPE html>

<html lang="fr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>GB Browser 3.0</title> <link rel="stylesheet" href="style.css"> </head>

<body>

<header> <h1>💜 GB BROWSER</h1> <p>Purple Gaming Edition 3.0</p> </header>

<main>

<section id="home">

<h2>🔎 Recherche Internet</h2>

<form id="search"> <input id="address" type="text" placeholder="Adresse ou recherche Google..." required> <button type="submit">Rechercher</button> </form>

<h2>🌐 Applications</h2>

<button type="button" data-url="https://www.google.com"> Google </button>

<button type="button" data-url="https://www.youtube.com"> YouTube </button>

<button type="button" data-url="https://www.wikipedia.org"> Wikipédia </button>

<button type="button" data-url="https://play.geforcenow.com"> GeForce NOW </button>

<h2>⭐ Favoris</h2>

<div id="favorites"></div>

<button type="button" id="addFavorite"> Ajouter aux favoris </button>

<h2>🕘 Historique</h2>

<div id="history"></div>

<button type="button" id="clearHistory"> Effacer l'historique </button>

</section>

<section id="navigation">

<h2>🎮 Navigation</h2>

<button type="button" id="back">◀ Retour</button> <button type="button" id="forward">Suivant ▶</button> <button type="button" id="refresh">🔄 Actualiser</button> <button type="button" id="homeButton">🏠 Accueil</button>

</section>

</main>

<footer> GB Browser 3.0 — Purple Edition </footer>

<script src="controls.js"></script>

<script> "use strict"; const address = document.getElementById("address"); function makeURL(value) { value = value.trim(); if (!value) return null; if (/^https?:\/\//i.test(value)) { return value; } if (/^[\w-]+(\.[\w-]+)+/.test(value)) { return "https://" + value; } return "https://www.google.com/search?q=" + encodeURIComponent(value); } function openSite(url) { if (!url) return; try { const newTab = window.open(url, "_blank"); if (!newTab) { alert("Ouverture bloquée. Autorise les fenêtres pop-up."); } else { saveHistory(url); } } catch (error) { alert("Impossible d'ouvrir ce site."); console.error(error); } } function saveHistory(url) { let history = JSON.parse( localStorage.getItem("gb_history") || "[]" ); history.unshift({ url: url, date: new Date().toLocaleString() }); history = history.slice(0, 30); localStorage.setItem( "gb_history", JSON.stringify(history) ); renderHistory(); } function getFavorites() { return JSON.parse( localStorage.getItem("gb_favorites") || "[]" ); } function renderFavorites() { const box = document.getElementById("favorites"); box.replaceChildren(); getFavorites().forEach(url => { const row = document.createElement("div"); const open = document.createElement("button"); open.textContent = "⭐ " + url; open.onclick = () => openSite(url); const remove = document.createElement("button"); remove.textContent = "❌"; remove.onclick = () => { const updated = getFavorites() .filter(item => item !== url); localStorage.setItem( "gb_favorites", JSON.stringify(updated) ); renderFavorites(); }; row.append(open, remove); box.appendChild(row); }); } function renderHistory() { const box = document.getElementById("history"); box.replaceChildren(); const history = JSON.parse( localStorage.getItem("gb_history") || "[]" ); history.forEach(item => { const button = document.createElement("button"); button.textContent = item.url; button.onclick = () => openSite(item.url); box.appendChild(button); }); } document.querySelectorAll("[data-url]").forEach(button => { button.addEventListener("click", () => { openSite(button.dataset.url); }); }); document.getElementById("search").addEventListener( "submit", event => { event.preventDefault(); openSite(makeURL(address.value)); } ); document.getElementById("addFavorite").onclick = () => { const url = makeURL(address.value); if (!url) { alert("Entre une adresse d'abord."); return; } const favorites = getFavorites(); if (!favorites.includes(url)) { favorites.push(url); localStorage.setItem( "gb_favorites", JSON.stringify(favorites) ); } renderFavorites(); }; document.getElementById("clearHistory").onclick = () => { localStorage.removeItem("gb_history"); renderHistory(); }; document.getElementById("back").onclick = () => { history.back(); }; document.getElementById("forward").onclick = () => { history.forward(); }; document.getElementById("refresh").onclick = () => { location.reload(); }; document.getElementById("homeButton").onclick = () => { window.scrollTo(0, 0); }; renderFavorites(); renderHistory(); </script>

</body> </html>
