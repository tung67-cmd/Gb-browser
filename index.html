<!DOCTYPE html>

<html lang="fr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>GB Browser 2.4</title> <link rel="stylesheet" href="style.css"> </head> <body>

<header> <h1>💜 GB BROWSER</h1> <p>Gaming Internet 2.4</p> </header>

<main>

<section id="home">

<h2>🔎 Recherche Internet</h2>

<form id="search"> <input id="address" placeholder="Adresse ou recherche..." required> <button type="submit">Rechercher</button> </form>

<h2>🌐 Applications</h2>

<button data-url="https://www.google.com">Google</button> <button data-url="https://www.youtube.com">YouTube</button> <button data-url="https://www.wikipedia.org">Wikipédia</button> <button data-url="https://play.geforcenow.com">GeForce NOW</button>

<h2>⭐ Favoris</h2> <div id="favorites"></div>

<button id="addFavorite">Ajouter l'adresse aux favoris</button>

<h2>🕘 Historique</h2> <div id="history"></div> <button id="clearHistory">Effacer l'historique</button>

</section>

<section id="navigation"> <h2>🎮 Navigation</h2> <button id="back">◀ Retour</button> <button id="forward">Suivant ▶</button> <button id="refresh">🔄 Actualiser</button> <button id="homeButton">🏠 Accueil</button> </section>

</main>

<footer>GB Browser 2.4 — Purple Edition</footer>

<script src="controls.js"></script>

<script> let lastUrl = ""; function openSite(url) { if (!/^https?:\/\//i.test(url)) return; lastUrl = url; GB.saveHistory(url); const tab = window.open(url, "_blank"); if (!tab) { alert("Autorise les fenêtres pop-up pour continuer."); } renderHistory(); } function renderFavorites() { const box = document.getElementById("favorites"); box.replaceChildren(); GB.getFavorites().forEach(url => { const row = document.createElement("div"); const open = document.createElement("button"); open.textContent = "⭐ " + url; open.onclick = () => openSite(url); const remove = document.createElement("button"); remove.textContent = "❌"; remove.onclick = () => { const list = GB.getFavorites().filter(item => item !== url); localStorage.setItem("gb_favorites", JSON.stringify(list)); renderFavorites(); }; row.append(open, remove); box.appendChild(row); }); } function renderHistory() { const box = document.getElementById("history"); box.replaceChildren(); GB.getHistory().forEach(item => { const button = document.createElement("button"); button.textContent = item.url; button.onclick = () => openSite(item.url); box.appendChild(button); }); } document.querySelectorAll("[data-url]").forEach(button => { button.onclick = () => openSite(button.dataset.url); }); document.getElementById("search").onsubmit = event => { event.preventDefault(); const value = document.getElementById("address").value.trim(); if (!value) return; const url = /^https?:\/\//i.test(value) ? value : /^[\w-]+\.[a-z]{2,}/i.test(value) ? "https://" + value : "https://www.google.com/search?q=" + encodeURIComponent(value); openSite(url); }; document.getElementById("addFavorite").onclick = () => { const value = document.getElementById("address").value.trim(); if (!value) { alert("Entre une adresse dans la barre de recherche."); return; } const url = /^https?:\/\//i.test(value) ? value : "https://" + value; GB.saveFavorite(url); renderFavorites(); }; document.getElementById("clearHistory").onclick = () => { localStorage.removeItem("gb_history"); renderHistory(); }; document.getElementById("homeButton").onclick = () => { window.scrollTo(0, 0); }; document.getElementById("back").onclick = () => { window.history.back(); }; document.getElementById("forward").onclick = () => { window.history.forward(); }; document.getElementById("refresh").onclick = () => { window.location.reload(); }; renderFavorites(); renderHistory(); </script>

</body> </html>
