<!DOCTYPE html>

<html lang="fr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>GB Browser 1.0</title>

<!-- Liaison avec le design -->

<link rel="stylesheet" href="style.css">

</head>

<body>

<header> <h1>💜 GB BROWSER</h1> <p>Your Gaming Internet</p> </header>

<main>

<h2>🔎 Recherche Internet</h2>

<form id="search"> <input id="address" type="text" placeholder="Rechercher ou entrer une adresse..." > <br> <button type="submit">Rechercher</button> </form>

<h2>🌐 Applications</h2>

<button onclick="openSite('https://www.google.com')"> 🔎 Google </button>

<button onclick="openSite('https://www.youtube.com')"> ▶ YouTube </button>

<button onclick="openSite('https://www.wikipedia.org')"> 🌍 Wikipédia </button>

<button onclick="openSite('https://play.geforcenow.com')"> 🎮 GeForce NOW </button>

<h2>⭐ Navigation</h2>

<button onclick="history.back()">◀ Retour</button> <button onclick="history.forward()">Suivant ▶</button>

</main>

<footer> GB Browser 1.0 — Purple Gaming Edition </footer>

<script> function openSite(url) { window.open(url, "_blank"); } document.getElementById("search").addEventListener("submit", function(e) { e.preventDefault(); const value = document.getElementById("address").value.trim(); if (!value) return; let url; if (/^https?:\/\//i.test(value)) { url = value; } else if (value.includes(".") && !value.includes(" ")) { url = "https://" + value; } else { url = "https://www.google.com/search?q=" + encodeURIComponent(value); } window.open(url, "_blank"); }); </script>

<!-- Liaison avec les commandes -->

<script src="controls.js"></script>

</body> </html>
